<template>
    <div class="builder-root">

        <!-- ===== TOP HEADER ===== -->
        <div class="builder-header">
            <div class="header-left">
                <span class="builder-icon">
                    <template if:true={hasAvatar}>
                        <img class="header-avatar" src={avatarUrl} alt="avatar"/>
                    </template>
                    <template if:false={hasAvatar}>
                        <img class="header-avatar" src={avatar} alt="avatar"/>
                    </template>
                </span>
                <div class="builder-header-text">
                    <div class="builder-title">Agentforce Builder</div>
                    <div class="builder-subtitle">Design your custom AI agent</div>
                </div>
            </div>

            <div class="header-right">
                <div class="builder-title">Chat Panel Preview</div>
            </div>

            <div class="header-actions">
                <!-- Version History Button -->
                <button class={versionHistoryBtnClass} onclick={toggleVersionHistory}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/>
                        <path d="M12 7v5l4 2"/>
                    </svg>
                    Publish History
                    <template if:true={hasVersions}>
                        <span class="ver-count-badge">{versionCount}</span>
                    </template>
                </button>

                <lightning-button
                    label="Publish"
                    variant="brand"
                    onclick={handlePublish}>
                </lightning-button>
            </div>
        </div>

        <!-- ===== VERSION HISTORY SLIDE-IN PANEL ===== -->
        <template if:true={showVersionHistory}>
            <div class="version-history-panel">

                <!-- Panel header -->
                <div class="vh-header">
                    <div class="vh-header-left">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/>
                            <path d="M12 7v5l4 2"/>
                        </svg>
                        <span class="vh-title">Publish History</span>
                        <template if:true={hasVersions}>
                            <span class="vh-count-pill">{versionCount} versions</span>
                        </template>
                    </div>
                    <button class="vh-close-btn" onclick={toggleVersionHistory}
                            title="Close version history">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round"
                            stroke-linejoin="round" width="14" height="14">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <!-- Version rows -->
                <template if:true={hasVersions}>
                    <div class="vh-list">
                        <template for:each={versions} for:item="ver">
                            <div key={ver.id}
                                class="vh-row"
                                data-id={ver.id}
                                onclick={navigateToVersion}
                                role="button"
                                tabindex="0">

                                <!-- Version number circle -->
                                <div class={ver.numClass}>
                                    {ver.versionNum}
                                </div>

                                <!-- Name + date -->
                                <div class="vh-row-info">
                                    <div class="vh-row-name">{ver.name}</div>
                                    <div class="vh-row-date">
                                        <svg width="11" height="11" viewBox="0 0 24 24"
                                            fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round" aria-hidden="true">
                                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                            <line x1="16" y1="2" x2="16" y2="6"/>
                                            <line x1="8" y1="2" x2="8" y2="6"/>
                                            <line x1="3" y1="10" x2="21" y2="10"/>
                                        </svg>
                                        {ver.createdDate}
                                    </div>
                                </div>

                                <!-- Active pill + chevron -->
                                <div class="vh-row-right">
                                    <template if:true={ver.isActive}>
                                        <span class="vh-pill vh-pill--active">Active</span>
                                    </template>
                                    <template if:false={ver.isActive}>
                                        <span class="vh-pill vh-pill--inactive">Inactive</span>
                                    </template>
                                    <svg class="vh-chevron" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5"
                                        stroke-linecap="round" stroke-linejoin="round"
                                        width="14" height="14" aria-hidden="true">
                                        <polyline points="9 18 15 12 9 6"/>
                                    </svg>
                                </div>

                            </div>
                        </template>
                    </div>
                </template>

                <!-- Empty state -->
                <template if:false={hasVersions}>
                    <div class="vh-empty">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/>
                            <path d="M12 7v5l4 2"/>
                        </svg>
                        <p>No published versions yet.</p>
                        <p>Publish your configuration to create the first version.</p>
                    </div>
                </template>

            </div>
        </template>

        <template if:true={hasUnpublishedChanges}>

            <div class="publish-warning-banner">

                <div class="publish-warning-left">

                    <span class="warning-icon">⚠️</span>

                    <div>
                        <div class="warning-title">
                            Unpublished Changes
                        </div>

                        <div class="warning-subtitle">
                            Publish to make updates visible on the website.
                        </div>
                    </div>

                </div>

                <!-- <lightning-button
                    label="Publish Now"
                    variant="brand"
                    onclick={handlePublish}>
                </lightning-button> -->

            </div>

        </template>

        <template if:true={field}>
            <div class="builder-body">

                <!-- ===== LEFT CONFIG PANEL ===== -->
                <div class={configPanelClass} style={configPanelStyle}>

                    <!-- FLAT TABS -->
                    <div class="flat-tabs">
                        <button class={commonTabClass} onclick={activateCommonTab}>General</button>
                        <button class={homePanelTabClass} onclick={activateHomeTab}>Home Panel</button>
                        <button class={sidePanelTabClass} onclick={activateSideTab}>Side Panel</button>
                    </div>

                    <!-- SCROLLABLE CONTENT -->
                    <div class="panel-scroll">

                        <!-- ================= HOME PANEL TAB ================= -->
                        <template if:true={isHomeTab}>

                            <div class="toggle-row-new">
                                <span class="toggle-label-text">Show Home Panel</span>
                                <label class="custom-toggle">
                                    <input type="checkbox" checked={showHomePanel} onchange={handleToggle} />
                                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                                </label>
                            </div>

                            <div class="accordion-item">
                                <div class="accordion-header" onclick={toggleBranding}>
                                    <span class="accordion-label">Welcome Section</span>
                                    <span class="accordion-chevron">
                                        <template if:true={showBranding}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
                                        </template>
                                        <template if:false={showBranding}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                                        </template>
                                    </span>
                                </div>
                                <template if:true={showBranding}>
                                    <div class="accordion-body">
                                        <div class="field-stack">
                                            <lightning-input label="Welcome Title" maxlength="32768" data-field="Welcome_Message__c"
                                                value={safeWelcomeMessage} onblur={handleChange} field-level-help="Main heading shown when chat opens">
                                            </lightning-input>
                                            <lightning-textarea label="Welcome Description" maxlength="32768" data-field="Welcome_Description__c"
                                                value={safeWelcomeDesc} onblur={handleChange} field-level-help="Small text shown below the heading">
                                            </lightning-textarea>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <div class="accordion-item">
                                <div class="accordion-header" onclick={toggleCommonColors}>
                                    <span class="accordion-label">Color Palette</span>
                                    <span class="accordion-chevron">
                                        <template if:true={showCommonColors}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
                                        </template>
                                        <template if:false={showCommonColors}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                                        </template>
                                    </span>
                                </div>
                                <template if:true={showCommonColors}>
                                    <div class="accordion-body">
                                        <div class="color-grid">
                                            <div class="color-field-wrapper">
                                                <label class="color-field-label">Header Color 
                                                    <lightning-helptext content="Top bar color of chat window"></lightning-helptext>
                                                </label>
                                                <div class="color-picker-box" onclick={openColorPicker} data-field="Header_color__c">
                                                    <span class="color-swatch" style={headerColorSwatch}></span>
                                                    <span class="color-hex">#{headerColorHex}</span>
                                                    <input type="color" class="hidden-color-input" maxlength="50" data-field="Header_color__c" value={safeHeaderColor} onchange={handleChange} />
                                                </div>
                                            </div>
                                            <div class="color-field-wrapper color-field-wrapper--full">
                                                <label class="color-field-label">Background</label>
                                                <div class="gradient-row">
                                                    <div class="color-field-wrapper">
                                                        <label class="color-field-label">Primary
                                                            <lightning-helptext content="Main background color of chat"></lightning-helptext>
                                                        </label>
                                                        <div class="color-picker-box" onclick={openColorPicker}>
                                                            <span class="color-swatch" style={gradientStartSwatch}></span>
                                                            <span class="color-hex">{gradientStartHex}</span>
                                                            <input type="color" class="hidden-color-input" data-field="Gradient_Start__c" value={safeGradientStart} onchange={handleChange}/>
                                                        </div>
                                                    </div>
                                                    <div class="color-field-wrapper">
                                                        <label class="color-field-label">Secondary (Optional)
                                                            <lightning-helptext content="Second color for gradient background (optional/ For better UI look)"></lightning-helptext>
                                                        </label>
                                                        <div class="color-picker-box-wrapper">
                                                            <div class="color-picker-box" onclick={openColorPicker}>
                                                                <span class="color-swatch" style={gradientEndSwatch}></span>
                                                                <span class="color-hex">{gradientEndHex}</span>
                                                                <input type="color" class="hidden-color-input" data-field="Gradient_End__c" value={safeGradientEnd} onchange={handleChange}/>
                                                            </div>
                                                            <template if:true={safeGradientEnd}>
                                                                <button class="color-clear-btn" onclick={clearGradientEnd} title="Clear secondary color">
                                                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                                                        stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
                                                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                                                    </svg>
                                                                </button>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="helper-text">Select one color for solid background or two colors for gradient.</div>
                                            </div>
                                            <div class="color-field-wrapper">
                                                <label class="color-field-label">User Bubble
                                                    <lightning-helptext content="Background color of user's message box"></lightning-helptext>
                                                </label>
                                                <div class="color-picker-box" onclick={openColorPicker} data-field="User_Bubble_Color__c">
                                                    <span class="color-swatch" style={userBubbleColorSwatch}></span>
                                                    <span class="color-hex">#{userBubbleColorHex}</span>
                                                    <input type="color" class="hidden-color-input" maxlength="50" data-field="User_Bubble_Color__c" value={safeUserBubble} onchange={handleChange} />
                                                </div>
                                            </div>
                                            <div class="color-field-wrapper">
                                                <label class="color-field-label">User Message
                                                    <lightning-helptext content="Text color of user's messages"></lightning-helptext>
                                                </label>
                                                <div class="color-picker-box" onclick={openColorPicker} data-field="User_message_color__c">
                                                    <span class="color-swatch" style={userMsgColorSwatch}></span>
                                                    <span class="color-hex">#{userMsgColorHex}</span>
                                                    <input type="color" class="hidden-color-input" maxlength="50" data-field="User_message_color__c" value={safeUserMsg} onchange={handleChange} />
                                                </div>
                                            </div>
                                            <div class="color-field-wrapper">
                                                <label class="color-field-label">Bot Bubble
                                                    <lightning-helptext content="Background color of bot messages"></lightning-helptext>
                                                </label>
                                                <div class="color-picker-box" onclick={openColorPicker} data-field="Bot_Bubble_Color__c">
                                                    <span class="color-swatch" style={botBubbleColorSwatch}></span>
                                                    <span class="color-hex">#{botBubbleColorHex}</span>
                                                    <input type="color" class="hidden-color-input" maxlength="50" data-field="Bot_Bubble_Color__c" value={safeBotBubble} onchange={handleChange} />
                                                </div>
                                            </div>
                                            <div class="color-field-wrapper">
                                                <label class="color-field-label">Bot Message
                                                    <lightning-helptext content="Text color of bot messages"></lightning-helptext>
                                                </label>
                                                <div class="color-picker-box" onclick={openColorPicker} data-field="Bot_message_color__c">
                                                    <span class="color-swatch" style={botMsgColorSwatch}></span>
                                                    <span class="color-hex">#{botMsgColorHex}</span>
                                                    <input type="color" class="hidden-color-input" maxlength="50" data-field="Bot_message_color__c" value={safeBotMsg} onchange={handleChange} />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <div class="accordion-item">
                                <div class="accordion-header" onclick={toggleSizing}>
                                    <span class="accordion-label">Sizing</span>
                                    <span class="accordion-chevron">
                                        <template if:true={showSizing}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
                                        </template>
                                        <template if:false={showSizing}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                                        </template>
                                    </span>
                                </div>
                                <template if:true={showSizing}>
                                    <div class="accordion-body">
                                        <div class="field-stack">
                                            <div class="slider-field">
                                                <div class="slider-field-header">
                                                    <label class="slider-label">Width
                                                        <lightning-helptext content="Width of chat window"></lightning-helptext>
                                                    </label>
                                                    <span class="slider-value-badge">{safeHomePanelWidth}px</span>
                                                </div>
                                                <input type="range" class="custom-slider" min="320" max="1500" step="10" data-field="Home_Panel_Width__c" value={safeHomePanelWidth} onchange={handleChange} oninput={handleSliderInput} />
                                            </div>
                                            <div class="slider-field">
                                                <div class="slider-field-header">
                                                    <label class="slider-label">Height
                                                        <lightning-helptext content="Height of chat window"></lightning-helptext>
                                                    </label>
                                                    <span class="slider-value-badge">{safeHomePanelHeight}px</span>
                                                </div>
                                                <input type="range" class="custom-slider" min="400" max="700" step="10" data-field="Home_Panel_Height__c" value={safeHomePanelHeight} onchange={handleChange} oninput={handleSliderInput} />
                                            </div>
                                            <div class="slider-field">
                                                <div class="slider-field-header">
                                                    <label class="slider-label">Border Radius
                                                        <lightning-helptext content="How rounded the chat corners look"></lightning-helptext>
                                                    </label>
                                                    <span class="slider-value-badge">{safeHomePanelRadius}px</span>
                                                </div>
                                                <input type="range" class="custom-slider" min="0" max="30" step="1" data-field="Home_Panel_border_radius__c" value={safeHomePanelRadius} onchange={handleChange} oninput={handleSliderInput} />
                                            </div>
                                            <div class="slider-field">
                                                <div class="slider-field-header">
                                                    <label class="slider-label">Avatar Border Radius
                                                        <lightning-helptext content="Shape of avatar (0 = square, 50 = circle)"></lightning-helptext>
                                                    </label>
                                                    <span class="slider-value-badge">{safeHomeAvatarRadius}%</span>
                                                </div>
                                                <input type="range" class="custom-slider" min="0" max="50" step="1" data-field="Home_Panel_Avatar_Border_Radius__c" value={safeHomeAvatarRadius} onchange={handleChange} oninput={handleSliderInput} />
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>

                        </template>

                        <!-- ================= SIDE PANEL TAB ================= -->
                        <template if:true={isSideTab}>

                            <div class="toggle-row-new">
                                <span class="toggle-label-text">Show Side Panel</span>
                                <label class="custom-toggle">
                                    <input type="checkbox" checked={showSidePanelChecked} onchange={handleSidePanelToggle} />
                                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                                </label>
                            </div>

                            <div class="accordion-item">
                                <div class="accordion-header" onclick={toggleBranding}>
                                    <span class="accordion-label">Branding</span>
                                    <span class="accordion-chevron">
                                        <template if:true={showBranding}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
                                        </template>
                                        <template if:false={showBranding}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                                        </template>
                                    </span>
                                </div>
                                <template if:true={showBranding}>
                                    <div class="accordion-body">
                                        <div class="field-stack">
                                            <lightning-input label="Header Content" data-field="Header_Content__c" maxlength="50" value={safeHeaderContent} onblur={handleChange} field-level-help="Text shown at top of chat"></lightning-input>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <div class="accordion-item">
                                <div class="accordion-header" onclick={toggleMessages}>
                                    <span class="accordion-label">Messages</span>
                                    <span class="accordion-chevron">
                                        <template if:true={showMessages}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
                                        </template>
                                        <template if:false={showMessages}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                                        </template>
                                    </span>
                                </div>
                                <template if:true={showMessages}>
                                    <div class="accordion-body">
                                        <div class="field-stack">
                                            <lightning-input field-level-help="Small message shown when panel opens" maxlength="255" label="Toast Message" data-field="Side_Panel_Toast_Msg__c" value={safeSideToast} onblur={handleChange}></lightning-input>
                                            <lightning-textarea field-level-help="First message sent automatically by bot" maxlength="32768" label="Initial Bot Message" data-field="First_Bot_Message__c" value={safeFirstBotMessage} onchange={handleChange}></lightning-textarea>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <div class="accordion-item">
                                <div class="accordion-header" onclick={toggleCommonColors}>
                                    <span class="accordion-label">Color Palette</span>
                                    <span class="accordion-chevron">
                                        <template if:true={showCommonColors}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
                                        </template>
                                        <template if:false={showCommonColors}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                                        </template>
                                    </span>
                                </div>
                                <template if:true={showCommonColors}>
                                    <div class="accordion-body">
                                        <div class="color-grid">
                                            <div class="color-field-wrapper">
                                                <label class="color-field-label">Header Color
                                                    <lightning-helptext content="Top bar color of chat window"></lightning-helptext>
                                                </label>
                                                <div class="color-picker-box" onclick={openColorPicker} data-field="Header_color__c">
                                                    <span class="color-swatch" style={headerColorSwatch}></span>
                                                    <span class="color-hex">#{headerColorHex}</span>
                                                    <input type="color" class="hidden-color-input" maxlength="50" data-field="Header_color__c" value={safeHeaderColor} onchange={handleChange} />
                                                </div>
                                            </div>
                                            <div class="color-field-wrapper color-field-wrapper--full">
                                                <label class="color-field-label">Background</label>
                                                <div class="gradient-row">
                                                    <div class="color-field-wrapper">
                                                        <label class="color-field-label">Primary
                                                            <lightning-helptext content="Main background color of chat"></lightning-helptext>
                                                        </label>
                                                        <div class="color-picker-box" onclick={openColorPicker}>
                                                            <span class="color-swatch" style={gradientStartSwatch}></span>
                                                            <span class="color-hex">{gradientStartHex}</span>
                                                            <input type="color" class="hidden-color-input" data-field="Gradient_Start__c" value={safeGradientStart} onchange={handleChange}/>
                                                        </div>
                                                    </div>
                                                    <div class="color-field-wrapper">
                                                        <label class="color-field-label">Secondary (Optional)
                                                            <lightning-helptext content="Second color for gradient background (optional/ For better UI look)"></lightning-helptext>
                                                        </label>
                                                        <div class="color-picker-box-wrapper">
                                                            <div class="color-picker-box" onclick={openColorPicker}>
                                                                <span class="color-swatch" style={gradientEndSwatch}></span>
                                                                <span class="color-hex">{gradientEndHex}</span>
                                                                <input type="color" class="hidden-color-input" data-field="Gradient_End__c" value={safeGradientEnd} onchange={handleChange}/>
                                                            </div>
                                                            <template if:true={safeGradientEnd}>
                                                                <button class="color-clear-btn" onclick={clearGradientEnd} title="Clear secondary color">
                                                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                                                        stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
                                                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                                                    </svg>
                                                                </button>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </div>

                                                    <span class="prev-hint-icon">💬</span>
                                                    <span class="prev-hint-text">Send a message to preview the chat</span>
                                                </div>
                                            </div>
                                        </template>

                                        <!-- Messages -->
                                        <template if:true={isChatStarted}>
                                            <div class="prev-messages-wrapper">
                                                <template for:each={formattedMessages} for:item="msg">
                                                    <template if:true={msg.isUser}>
                                                        <div key={msg.id} class="prev-msg-row prev-user-row prev-slide-left">
                                                            <div class="prev-bubble prev-user-bubble" style={msg.style}>
                                                                {msg.text}
                                                            </div>
                                                        </div>
                                                    </template>
                                                    <template if:false={msg.isUser}>
                                                        <div key={msg.id} class="prev-msg-row prev-bot-row prev-slide-right">
                                                            <template if:true={hasAvatar}>
                                                                <img src={avatarUrl} class="prev-chat-avatar-mini" alt="Bot"/>
                                                            </template>
                                                            <template if:false={hasAvatar}>
                                                                <!-- <span class="prev-chat-avatar-mini prev-avatar-fallback">🤖</span> -->
                                                                <img class="prev-chat-avatar-mini" src={avatar} alt="avatar"/>
                                                            </template>
                                                            <div class="prev-bubble prev-bot-bubble" style={msg.style}>
                                                                {msg.text}
                                                            </div>
                                                        </div>
                                                    </template>
                                                </template>

                                                <!-- Bot typing indicator -->
                                                <div class="prev-msg-row prev-bot-row prev-typing-row prev-slide-right">
                                                    <template if:true={hasAvatar}>
                                                        <img src={avatarUrl} class="prev-chat-avatar-mini" alt="Bot"/>
                                                    </template>
                                                    <template if:false={hasAvatar}>
                                                        <!-- <span class="prev-chat-avatar-mini prev-avatar-fallback">🤖</span> -->
                                                        <img class="prev-chat-avatar-mini" src={avatar} alt="avatar"/>
                                                    </template>
                                                    <div class="prev-bubble prev-bot-bubble prev-typing-bubble" style={botBubbleStyle}>
                                                        <span class="prev-typing-label">{safeTypingIndicator}</span>
                                                        <span class="prev-typing-dots">
                                                            <span class="prev-dot"></span>
                                                            <span class="prev-dot"></span>
                                                            <span class="prev-dot"></span>
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>

                                    </div>

                                    <!-- ── Input bar ── -->
                                    <div class="prev-phone-input-section" style={phoneInputSectionStyle}>
                                        <div class="prev-phone-input-bar" style={phoneInputBarStyle}>
                                            <input
                                                class="prev-phone-input-field"
                                                style={phoneInputFieldStyle}
                                                placeholder={safeInputPlaceholder}
                                                value={currentInput}
                                                oninput={handleInputChange}
                                                onkeydown={handlePreviewKeyPress}
                                            />
                                            <div class="prev-phone-input-actions">
                                                <button class="prev-send-btn" style={phoneSendBtnStyle} onclick={sendMessage}>
                                                    <template if:true={hasSendIcon}>
                                                        <img src={sendIconUrl} class="prev-send-icon-img"/>
                                                    </template>
                                                    <template if:false={hasSendIcon}>
                                                        <svg viewBox="0 0 24 24" class="prev-send-icon-svg"
                                                            fill="none" stroke="currentColor"
                                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                            <line x1="22" y1="2" x2="11" y2="13"></line>
                                                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                                        </svg>
                                                    </template>
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                </template>
                                <!-- end VIEW B -->

                            </div>
                            <!-- end prev-phone-outer -->
                        </template>

                    </template>
                    <!-- end isSideTab -->

                </div>

            </div>
        </template>

    </div>
</template>
